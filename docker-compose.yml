services:
  mysql:
    image: mysql:8.4
    container_name: corner-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: corner
      MYSQL_USER: corner
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-corner_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - '3306:3306'
    volumes:
      - corner-mysql:/var/lib/mysql
volumes:
  corner-mysql:
